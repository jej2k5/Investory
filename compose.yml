version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: investory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-investory}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - investory-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: investory-backend
    restart: unless-stopped
    environment:
      INVESTORY_API_BASE_URL: ${INVESTORY_API_BASE_URL:-http://backend:8000}
      DATABASE_URL: ${postgrespostgresql://${DB_USER_USER}:${DB_PASSWORD}@ldb:5432/investory}
      ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY:-demo}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - investory-network
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Initializing database...' &&
        python init_db.py || true &&
        echo 'Starting server...' &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "


  # MCP Service (HTTP transport for agent platforms)
  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: investory-mcp
    restart: unless-stopped
    environment:
      INVESTORY_API_BASE_URL: ${INVESTORY_API_BASE_URL:-http://backend:8000}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8090
      MCP_SERVICE_AUTH_TOKEN: ${MCP_SERVICE_AUTH_TOKEN:-}
    ports:
      - "${MCP_PORT:-8090}:8090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - investory-network
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        python mcp_server.py --transport http --host 0.0.0.0 --port 8090
      "
  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: investory-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - investory-network

  # pgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: investory-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@investory.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    networks:
      - investory-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local

networks:
  investory-network:
    driver: bridge
